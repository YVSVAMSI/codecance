services:
  db:
    image: postgres:16-alpine
    container_name: dsa-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dsa_tracker
    ports:
      - "5433:5432"
    volumes:
      - dsa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dsa_tracker"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dsa_pgdata:
