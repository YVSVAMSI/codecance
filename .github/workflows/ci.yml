name: CI

on:
  push:
    branches: [main, phase-**]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      PORT: "5050"
      DATABASE_URL: "postgresql://ci_dummy_user:ci_dummy_password@localhost:5432/ci_dummy_db?schema=public"
      JWT_SECRET: "ci-dummy-jwt-secret-key-at-least-32-characters-long"
      CORS_ORIGIN: "http://localhost:5173"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Build frontend
        run: npm run build
